# ==============================================================================
# AI-NIDS Configuration
# ==============================================================================
# Central configuration file (no .env). All runtime settings are here.
# Changes take effect on restart unless noted otherwise.
# ==============================================================================

network:
  interface: "auto"           # "auto" = detect active NIC; or specify name like "eth0"
  home_net: ["auto"]          # "auto" = derive /32 from interface IP; or explicit list
  capture_timeout: 10         # seconds per capture window
  max_packets: 1000           # packets per batch

features:
  flow_timeout: 60            # seconds before a flow expires
  selected_features:          # canonical source is core/features.py
    - dst_port
    - duration
    - src_bytes
    - dst_bytes
    - packet_count
    - avg_packet_len
    - std_packet_len
    - flow_bytes_per_sec
    - flow_packets_per_sec
    - fwd_packet_len_max
    - bwd_packet_len_max
    - flow_iat_mean
    - flow_iat_std
    - flow_iat_max
    - flow_iat_min
    - fin_flag_count
    - syn_flag_count
    - rst_flag_count
    - psh_flag_count
    - ack_flag_count
    - syn_ratio
    - fin_ratio
    - rst_ratio
    - ack_ratio
    - psh_ratio
    - port_is_web
    - port_is_mail
    - port_is_admin
    - port_is_db
    - port_is_dns

# ------------------------------------------------------------------------------
# Model (ML Ensemble)
# ------------------------------------------------------------------------------
model:
  type: "ensemble"            # random_forest | autoencoder | ensemble
  rf_n_estimators: 200
  rf_max_depth: 20
  rf_weight: 0.65
  ae_weight: 0.35
  # Dynamic per-flow split (default on): each engine's weight is proportional
  # to its decisiveness (|score - 0.5|) for that flow. RF keeps a minimum
  # weight (min_rf_weight) because it is better calibrated than the AE.
  # Disagreement between the engines is dampened toward the threshold.
  dynamic_weights: true
  min_rf_weight: 0.5
  anomaly_threshold: 0.5      # score above this = label ATTACK
  model_path: "data/models/nids_model.joblib"
  scaler_path: "data/models/scaler.joblib"
  label_encoder_path: "data/models/label_encoder.joblib"

# ------------------------------------------------------------------------------
# Alerts
# ------------------------------------------------------------------------------
alerts:
  severity_levels:
    low: 0.65
    medium: 0.80
    high: 0.92
  log_path: "data/alerts.jsonl"

# ------------------------------------------------------------------------------
# API (FastAPI Backend)
# ------------------------------------------------------------------------------
api:
  key: ""                  # set to an API key string to enable auth on all /api/ endpoints

# ------------------------------------------------------------------------------
# Dashboard (Next.js Frontend)
# ------------------------------------------------------------------------------
dashboard:
  api_host: "0.0.0.0"
  api_port: 8000
  frontend_port: 3000
  refresh_interval: 3         # seconds

# ------------------------------------------------------------------------------
# Threat Intelligence
# ------------------------------------------------------------------------------
threat_intel:
  feeds:
    emerging_threats: "https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt"
    feodo_tracker: "https://feodotracker.abuse.ch/downloads/ipblocklist.txt"

# ------------------------------------------------------------------------------
# Data Retention
# ------------------------------------------------------------------------------
retention:
  days: 30                # O1: delete flows/alerts older than this (0 = keep forever)

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging:
  level: "INFO"
  log_file: "data/nids.log"

# ------------------------------------------------------------------------------
# Redis (Optional — set active: false for in-memory fallback)
# ------------------------------------------------------------------------------
redis:
  host: "localhost"
  port: 6379
  db: 0
  active: true  # set to false to fallback to in-memory mode
